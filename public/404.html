<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>RUSSIAN STREETWEAR CLUB</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // Redirects 404s to index.html with the route encoded in the hash
      var pathSegmentsToKeep = 1;
      var l = window.location;
      var path = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/');
      var search = l.search ? (l.search.slice(1) ? '?' + l.search.slice(1) : '') : '';
      var hash = l.hash ? l.hash : '';
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        path + search + hash
      );
    </script>
  </head>
  <body style="background-color: #09090b; color: #f4f4f5; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <p>Загрузка RUSSIAN STREETWEAR CLUB...</p>
  </body>
</html>
